<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marsya's calculator</title>
</head>
<body>
    <form action="" method="post">
        <label>Number 1</label>
        <input type="number" id="firstNumber" placeholder="insert number"><br>
        <label for="">Number 2</label>
        <input type="number" id="secondNumber" placeholder="insert number"><br>
        <button type="button" id="btnAdd">Add (+)</button>
        <button type="button" id="btnSubtract">Add (-)</button>
        <button type="button" id="btnMultiply">Add (x)</button>
        <button type="button" id="btnDivide">Add (:)</button>
    </form>
    <h2 id="result"></h2>
    <script src="calculator.js"></script>
</body>
</html>
